# aions 터널 — locally-managed. 이 파일이 ingress 의 SSOT 다.
# 라우팅을 바꾸려면 여기를 고치고 커밋한다. 대시보드/API 로 밀어 넣지 말 것.
#
# www 는 여기 없다 — Cloudflare Redirect Rule 이 엣지에서 apex 로 301 시킨다.
# (Redirect Rule 은 오리진보다 먼저 평가되므로 ingress 에 없어도 404 로 안 떨어진다)
tunnel: 546cef06-7c99-44ae-989d-fca9dcfbb644
credentials-file: /etc/cloudflared/546cef06-7c99-44ae-989d-fca9dcfbb644.json

# 메트릭 — 컨테이너 안에서만. publish 하지 않는다
metrics: 0.0.0.0:2000

ingress:
  - hostname: aionsclubs.org
    service: http://aions-web:80
  # www 도 당분간 같이 서빙한다 — apex 가 살아나면 Redirect Rule(301)로 옮기고
  # 이 줄을 지운다. 지금 빼면 www 가 404 라 집을 확인할 길이 없다.
  - hostname: www.aionsclubs.org
    service: http://aions-web:80
  - service: http_status:404
