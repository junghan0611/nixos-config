services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped

    # 호스트 NIC(enp0s6, 10.0.0.157)에만 바인딩한다 — 0.0.0.0이 아니다.
    # `tailscale serve --bg --https=443`(machines/oracle.nix, OpenClaw gateway
    # 레인)이 tailnet IP 100.67.72.1:443을 잡는데, 리눅스는 0.0.0.0:443과
    # 특정IP:443을 공존시키지 않는다. 재부팅하면 tailscaled가 docker보다 먼저
    # 올라와 443을 선점하고 caddy는 exit 128("address already in use")로 죽는다.
    # 공인 IPv6가 없어 A레코드(168.107.2.68)만 쓰므로 IPv4 NIC 바인딩으로 충분.
    ports:
      - "10.0.0.157:80:80"
      - "10.0.0.157:443:443"
      - "10.0.0.157:443:443/udp"  # HTTP/3

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /home/junghan/docker-data/caddy/data:/data
      - /home/junghan/docker-data/caddy/config:/config
      # ax.junghanacs.com 정적 web root (apply/ax `make publish` 산출물)
      # 볼륨을 새로 붙이거나 뺄 땐 restart로 안 먹는다 → up -d --force-recreate
      - /home/junghan/docker-data/ax:/srv/ax:ro

    networks:
      - proxy

networks:
  proxy:
    name: proxy
    driver: bridge
