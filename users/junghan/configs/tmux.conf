set  -g default-terminal "tmux-256color"
set  -g base-index      1
setw -g pane-base-index 1

# default-shell을 고정한다. 지정하지 않으면 tmux는 서버가 처음 뜨는 순간의
# $SHELL을 읽어 전역 옵션으로 굳혀버린다. nix devshell(`use flake`) 안에서
# tmux 서버가 태어나면 stdenv setup.sh가 덮어쓴 readline 없는 빌드용 bash가
# 박히고, 그 서버의 모든 pane이 bind/complete 없는 셸을 받는다.
set -g default-shell "/run/current-system/sw/bin/bash"

set -g status-keys vi
set -g mode-keys   vi

set  -g mouse             on
set  -g focus-events      on
setw -g aggressive-resize off
setw -g clock-mode-style  24
set  -s escape-time       0
set  -g history-limit     50000

# Alt-c를 보조 prefix로 추가 (Ctrl-b와 병행)
set -g prefix2 M-c

# True-color(24bit) 지원
# terminal-features: tmux → 외부 터미널 방향 (RGB 색상 패스스루)
# terminal-overrides: 모든 터미널에 Tc(true-color) 활성화
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-overrides ",*:Tc"

# COLORTERM 전달: tmux 내부 프로세스(Emacs 등)가 true-color 감지용
# update-environment: 새 세션 생성 시 외부에서 가져올 변수 목록
# set-environment: tmux 글로벌 환경에 직접 설정 (폴백)
set -ga update-environment "COLORTERM"
set-environment -g COLORTERM "truecolor"

# OSC-52 클립보드 지원 (SSH 원격 복사)
set -g set-clipboard on
set -g allow-passthrough on

# Copy mode
# prefix + Enter 로 copy-mode 진입. 영문/한글 입력기 상태와 무관하게 시작.
bind-key Enter copy-mode

# Vi 복사 모드 with OSC-52
# 영문 hjkl/v/y 도 유지하되, IME 영향이 적은 Ctrl 계열 대안도 같이 제공.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi Space send-keys -X begin-selection
# tmux 기본 V = select-line. Ctrl 계열 대안으로 C-v에도 같은 동작 부여.
bind-key -T copy-mode-vi C-v send-keys -X select-line
# rectangle 선택은 C-q로 유지 (vim에서 terminal 충돌 회피용 대안으로 흔함)
bind-key -T copy-mode-vi C-q send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'cat | base64 -w0 | xargs -I{} printf "\033]52;c;{}\007"'
bind-key -T copy-mode-vi C-y send-keys -X copy-pipe-and-cancel 'cat | base64 -w0 | xargs -I{} printf "\033]52;c;{}\007"'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'cat | base64 -w0 | xargs -I{} printf "\033]52;c;{}\007"'
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi C-g send-keys -X cancel
bind-key -T copy-mode-vi C-h send-keys -X cursor-left
bind-key -T copy-mode-vi C-j send-keys -X cursor-down
bind-key -T copy-mode-vi C-k send-keys -X cursor-up
bind-key -T copy-mode-vi C-l send-keys -X cursor-right
# 반쪽 스크롤을 emacs 쪽 손버릇에 맞춘다.
# ~/.doom.d/lisp/keybindings-config.el 이 M-u=evil-scroll-up, M-v=evil-scroll-down
# 으로 잡아두었으므로 copy-mode에서도 같은 방향을 쓴다.
# (emacs 기본 M-v는 반대 방향인 page-up이고, tmux의 copy-mode emacs 테이블도
#  그쪽을 따르지만 여기서는 evil 쪽 관례를 우선한다.)
# tmux 기본 C-u/C-d는 그대로 남는다.
bind-key -T copy-mode-vi M-u send-keys -X halfpage-up
bind-key -T copy-mode-vi M-v send-keys -X halfpage-down

# copy-mode 밖에서도 같은 키로 바로 스크롤한다.
# prefix + Enter 로 먼저 들어갈 필요 없이, M-u 한 번이 copy-mode 진입 +
# 반쪽 위로를 한꺼번에 한다. 이후는 위의 copy-mode-vi 바인딩이 이어받는다.
# (-n = prefix 없는 root 테이블이므로 pane 안 프로그램에게서 M-u/M-v를
#  가져간다. 터미널 emacs를 tmux 안에서 쓰게 되면 이 두 줄을 다시 볼 것.)
bind-key -n M-u copy-mode \; send-keys -X halfpage-up
bind-key -n M-v copy-mode \; send-keys -X halfpage-down

# 상태바 설정 (심플)
set -g status-bg colour235
set -g status-fg white

# 디바이스 배지 — 상태바 맨 왼쪽이 "지금 어느 기계 안인가"에 먼저 답한다.
# 정체성의 SSOT는 ~/.current-device 다 (hostname 아님). run.sh / SessionStart
# hook / diskclean.sh 가 프로파일을 고르는 데 쓰는 그 이름과 같은 값을 써야
# 상태바와 실제 동작이 갈라지지 않는다.
#
# status-interval(15초)마다 cat을 돌리지 않으려고 서버 기동 시 한 번만 읽어
# 사용자 옵션에 굳힌다. 디바이스 이름은 서버 수명 동안 바뀌지 않는 값이다.
# (값을 갈아끼웠다면 prefix + r 로 다시 읽힌다.)
run-shell 'tmux set -g @device "$(cat ~/.current-device 2>/dev/null || hostname -s)"'
# 이름만으로는 눈이 미끄러진다. oracle에서 친 명령을 로컬로 착각하는 쪽이
# 되돌리기 어려우므로 색까지 갈라 둔다: 원격 VM은 주황, 로컬은 각자 다른 색.
run-shell 'case "$(cat ~/.current-device 2>/dev/null)" in oracle) c=colour208 ;; nuc) c=colour111 ;; laptop) c=colour114 ;; thinkpad) c=colour141 ;; *) c=colour245 ;; esac; tmux set -g @device_color "$c"'

# 기본 status-left-length는 10이라 배지를 붙이면 그 자리에서 잘린다.
set -g status-left-length 40
set -g status-left '#[fg=colour235,bg=#{@device_color},bold] #{@device} #[fg=green,bg=colour235,nobold] #S '
set -g status-right '#[fg=cyan]%Y-%m-%d %H:%M'

# 창 분할 키 (현재 경로 유지)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# 분할(pane) 이동 vim 스타일
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# M-\ = 다음 분할 (emacs의 other-window). 한글 입력 중에도 되는 유일한 pane 이동.
#
# prefix + h/j/k/l 은 *글자* 라서 IME가 한글 모드면 tmux에 ㅎ/ㅗ/ㅏ/ㅣ 가 도착한다.
# 옆 분할로 가려고 한영키를 누르고 → 이동하고 → 다시 한영키를 누르는 왕복이 매번 생긴다.
# M-\ 는 글자가 아니라 IME를 안 탄다. M-[ / M-] (창 이동) 바로 옆자리라 손버릇도 이어진다:
#   M-[ M-]  = 창(window) 앞뒤       M-\  = 분할(pane) 다음
#
# ESC \ 는 ANSI에서 ST(String Terminator)라 M-[ 가 CSI 인 것과 같은 위험이 있지만,
# pty로 raw 바이트(\033\\)를 넣어도 삼켜지지 않고 M-\ 키로 도착한다(tmux 3.6a 실측).
# tmux 설정에서 \ 는 이스케이프 문자라 따옴표로 감싼다.
bind -n 'M-\' select-pane -t :.+

# 창 크기 조절 (Alt + 방향키)
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5

# ── 윈도우 이동 ──────────────────────────────────────────────────
# 층위가 셋이고 각각 다른 것이다. 헷갈리면 키를 잘못 건다:
#   session : `tm`이 디렉토리마다 하나씩 여는 것      → prefix + s (fzf)
#   window  : 그 세션 안의 창. prefix + 1/2/3 으로 가던 그것 → M-[ / M-]
#   pane    : 창 안의 분할                            → prefix + h/j/k/l, M-\
# 손이 제일 자주 가는 층이 window라 여기에 prefix 없는 키를 준다.
#
# M-[ / M-] 는 터미널에서 가장 조심스러운 조합이다. ESC [ 는 CSI(제어 시퀀스
# 시작), ESC ] 는 OSC 라서 키가 아니라 시퀀스 파편으로 먹힐 수 있다. tmux 3.6
# 에서 pty로 raw 바이트를 넣어 확인한 결과는:
#   - `\033[` 만 오면 → M-[ 키로 처리 (escape-time 0 에서도)
#   - `\033[A`(방향키), `\033[1;5D`(C-Left) → CSI 파싱이 먼저 이겨서 그대로 통과
# 즉 방향키를 삼키지 않는다. 다만 이건 tmux 쪽 이야기고, 터미널이 Alt-[ 를
# 애초에 보내주는지는 별개다(ghostty가 M-u/M-v를 삼켰던 전례를 참고).
bind -n M-[ previous-window
bind -n M-] next-window

# 세션이 대여섯 개를 넘으면 이름이 기억나지 않는다. prefix + s 를 fzf 팝업으로
# 바꾼다 — 손버릇(M-c s)은 그대로 두고 고르는 화면만 바꾸는 것.
# 기본 choose-tree(윈도우까지 트리로 펼침)는 prefix + S 로 남겨둔다.
bind s display-popup -E -w 70% -h 50% "tmux ls | fzf --reverse --prompt='switch> ' | cut -d: -f1 | xargs -r -I% tmux switch-client -t '=%'"
bind S choose-tree -Zs

# 설정 리로드
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# 세션 로깅 (작업 기록용)
bind P pipe-pane -o "cat >>~/tmux-#W.log" \; display "Logging to ~/tmux-#W.log"

# 윈도우 자동 리넘버링
set -g renumber-windows on
